[pytest]
# "pytest -q" (cách CI gọi) không tự thêm thư mục hiện tại vào sys.path như "python -m pytest":
# thiếu dòng này thì conftest không import được gói "app" và "tests".
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
